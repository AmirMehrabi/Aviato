# Include inside the portal's existing TLS server block.
location ^~ /build/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# These public files retain their URLs between releases.
location ~ ^/(?:assets/(?:images|icons)|favicons)/(?:[^/.][^/]*/)*[^/.][^/]*\.(?:avif|gif|ico|jpe?g|png|svg|webp|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
}
